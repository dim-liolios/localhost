<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uploads Debug</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    #status {
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        background: #f5f5f5;
    }

    li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
        border-bottom: 1px solid #ddd;
    }

    button {
        background: red;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.8;
    }

    pre {
        background: #eee;
        padding: 10px;
        overflow-x: auto;
    }
</style>
</head>

<body>

<h1>Uploads Debug Page</h1>

<div id="status">Waiting...</div>

<h2>Raw JSON</h2>
<pre id="rawJson"></pre>

<h2>Files</h2>
<ul id="uploadsList"></ul>

<script>
alert("SCRIPT LOADED");

console.log("SCRIPT STARTED");

function setStatus(msg) {
    document.getElementById("status").textContent = msg;
    console.log(msg);
}

async function fetchUploads() {
    try {
        setStatus("Fetching uploads...");

        const response = await fetch("http://localhost:8080/uploads/list");

        console.log("Response object:", response);
        console.log("Status:", response.status);

        setStatus("Response status: " + response.status);

        const text = await response.text();

        console.log("Raw response text:");
        console.log(text);

        document.getElementById("rawJson").textContent = text;

        const uploads = JSON.parse(text);

        console.log("Parsed uploads:", uploads);
        console.log("Type:", typeof uploads);
        console.log("Array:", Array.isArray(uploads));
        console.log("Length:", uploads.length);

        setStatus(
            "Parsed " +
            uploads.length +
            " file(s)"
        );

        const list = document.getElementById("uploadsList");
        list.innerHTML = "";

        uploads.forEach((filename, index) => {
            console.log("Rendering:", filename);

            const li = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = filename;

            const btn = document.createElement("button");
            btn.textContent = "Delete";

            btn.addEventListener("click", async () => {
                console.log("DELETE CLICKED:", filename);

                try {
                    const res = await fetch(
                        `http://localhost:8080/uploads/delete/${encodeURIComponent(filename)}`,
                        {
                            method: "DELETE"
                        }
                    );

                    console.log("Delete status:", res.status);

                    if (res.ok) {
                        fetchUploads();
                    }
                } catch (err) {
                    console.error("Delete error:", err);
                }
            });

            li.appendChild(span);
            li.appendChild(btn);
            list.appendChild(li);
        });

        console.log("Rendering complete");

    } catch (err) {
        console.error("FATAL ERROR:", err);

        setStatus("ERROR: " + err);
    }
}

window.addEventListener("load", () => {
    console.log("WINDOW LOADED");
    fetchUploads();
});
</script>

</body>
</html>
