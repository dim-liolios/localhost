<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
</head>
<body>
    <h1>Hello, World!</h1>
    <!-- upload button -->
    <button onclick="document.getElementById('fileInput').click()">Upload File</button>
    <input type="file" id="fileInput" style="display: none;">
    <p id="status"></p>
    <!-- go to uploads page -->
    <button onclick="window.location.href='/uploads'">Go to Uploads Page</button>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                console.log('Selected file:', file.name);
                async function uploadFile() {
                    const formData = new FormData();
                    formData.append('file', file);
                    try {
                        const response = await fetch('http://localhost:8080/uploads', {
                            method: 'POST',
                            body: formData
                        });
                        if (response.ok) {
                            document.getElementById('status').textContent = 'File uploaded successfully';
                        } else {
                            document.getElementById('status').textContent = 'File upload failed';
                        }
                    } catch (error) {
                        document.getElementById('status').textContent = 'Error: ' + error.message;
                    }
                }
                uploadFile();
            }
        });
    </script>
</body>
